name: Windows RDP Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Orise kwdiko RDP (toulaxiston 8 xaraktires)'
        required: true
        default: 'Nick@2026!'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows User Password
        run: |
          net user runneradmin "${{ github.event.inputs.access_password }}"

      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Install & Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Show RDP Info & Keep Active
        run: |
          $ip = tailscale ip -4
          Write-Host "=========================================="
          Write-Host "PC Name (gia to Windows App): $ip"
          Write-Host "Username: runneradmin"
          Write-Host "Password: ${{ github.event.inputs.access_password }}"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21500
