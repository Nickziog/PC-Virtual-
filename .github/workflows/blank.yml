name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Set a password for the user (minimum 6 characters)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure User Password
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Install Desktop Server & VNC
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server dbus-x11 firefox

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Start VNC Server
        run: |
          mkdir -p ~/.vnc
          echo "${{ github.event.inputs.access_password }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          echo "VNC Server started on port 5901"

      - name: Show VNC Info & Keep Active
        run: |
          IP=$(tailscale ip -4)
          echo "=========================================="
          echo "VNC Address (vale to sto RealVNC Viewer): ${IP}:5901"
          echo "Password: ${{ github.event.inputs.access_password }}"
          echo "=========================================="
          sleep infinity
