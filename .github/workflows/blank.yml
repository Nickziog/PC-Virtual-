name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Set a password for the user (minimum 6 characters)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure User Password
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Install Desktop Server, VNC and Ngrok
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server dbus-x11 firefox curl
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          sudo tar -xvzf ngrok.tgz -C /usr/local/bin
          rm ngrok.tgz
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Start VNC Server
        run: |
          mkdir -p ~/.vnc
          echo "${{ github.event.inputs.access_password }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup
          vncserver :1 -geometry 1280x720 -depth 24 -localhost no
          echo "VNC Server started on port 5901"

      - name: Expose VNC via Ngrok (TCP)
        run: |
          ngrok tcp 5901 --log=stdout > ngrok.log &
          sleep 5
          echo "=========================================="
          echo "VNC Address:"
          grep -o "tcp://[^ ]*" ngrok.log | sed 's|tcp://||'
          echo "Password: ${{ github.event.inputs.access_password }}"
          echo "=========================================="

      - name: Keep Machine Active
        run: |
          echo "Virtual PC ready! Use a VNC client to connect."
          sleep infinity
